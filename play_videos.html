<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LACART animation backups</title><style>body{margin:0;background:#0b183e;color:#fff;font:18px system-ui,sans-serif}main{max-width:1250px;margin:30px auto;padding:0 22px}h1{color:#f8c947}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{background:#f8c947;color:#0b183e;border:0;padding:12px 18px;cursor:pointer;font:inherit}video{width:100%;max-height:70vh;background:#0b183e}p{line-height:1.5;color:#acb9d2}</style><main><h1>LACART: click-to-play animation backups</h1><nav><button onclick="choose('A')">A: lookahead motion</button><button onclick="choose('B')">B: CBF controls</button><button onclick="choose('C')">C: closed loop</button></nav><video id="v" controls preload="metadata" src="media/anim_A.mp4"></video><p id="caption">A: schematic unicycle motion. Every label and equation is typeset in LaTeX.</p><p>These clips are analytical illustrations or a new illustrative simulation. They are not hardware videos. No network connection is required.</p></main><script>function choose(n){const v=document.getElementById('v');v.pause();v.src='media/anim_'+n+'.mp4';v.load();document.getElementById('caption').textContent=({A:'A: schematic unicycle motion. Every label and equation is typeset in LaTeX.',B:'B: a local CBF half-plane with bounded controls. No CLF or track constraints.',C:'C: identical reference, nominal controller and bounds. Only lookahead changes. Safety-only QP. Simulated time runs at twice playback speed.'})[n];}</script></html>
