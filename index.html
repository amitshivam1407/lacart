  if(sc.closed){let d=((ni-idx)%n+n)%n;if(d<n/2)prog+=d;}idx=ni;
  if(u[0]<0.03)still+=dt;else still=0;
  if(sc.closed&&prog>=n-1){info.outcome='lap';info.lap=(k+1)*dt;break;}
  if(!sc.closed&&s.x>=sc.px[n-1]-0.05){info.outcome='passed';info.lap=(k+1)*dt;break;}
  if(k*dt>1.5&&still>2){info.outcome='stalled';break;}
 }

function setup(c,aspect){const dpr=window.devicePixelRatio||1,w=c.clientWidth;c.width=Math.round(w*dpr);c.height=Math.round(w*aspect*dpr);const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return[g,w,w*aspect];}
function bounds(){if(mode==='appr'||mode==='cmp')return[-0.5,V.ox+2.7,-1.4,1.4];const d=D[mode];let a=[1e9,-1e9,1e9,-1e9];for(const L of d.outer)for(const[x,y]of L){a[0]=Math.min(a[0],x);a[1]=Math.max(a[1],x);a[2]=Math.min(a[2],y);a[3]=Math.max(a[3],y);}return[a[0]-.5,a[1]+.5,a[2]-.5,a[3]+.5];}
function drawScene(){
 const b=bounds(),asp=(b[3]-b[2])/(b[1]-b[0]);const[g,W,H]=setup($('sc'),Math.min(Math.max(asp,.3),1.1));
 const sx=W/(b[1]-b[0]),sy=H/(b[3]-b[2]),sc_=Math.min(sx,sy);const X=x=>(x-b[0])*sc_,Y=y=>H-(y-b[2])*sc_;
 g.fillStyle='#fff';g.fillRect(0,0,W,H);
 const poly=(L,col,wd,dash)=>{g.strokeStyle=col;g.lineWidth=wd;g.setLineDash(dash||[]);g.beginPath();L.forEach(([x,y],i)=>i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y)));g.stroke();g.setLineDash([]);};
 const sc=S.sc;
 if(mode!=='appr'&&mode!=='cmp'){for(const L of D[mode].inner)poly(L,'#9baeb5',2);for(const L of D[mode].outer)poly(L,'#9baeb5',2);}
 poly(sc.px.map((x,i)=>[x,sc.py[i]]).concat(sc.closed?[[sc.px[0],sc.py[0]]]:[]),'#b7c7cc',1.5,[6,5]);
 if(mode==='appr'||mode==='cmp'){g.fillStyle='#64747c';g.font='12px system-ui';for(let x=0;x<=b[1];x+=0.5)g.fillText(x.toFixed(1),X(x)-8,H-4);}
 sc.obs.forEach((o,k)=>{g.fillStyle='rgba(196,67,54,.13)';g.beginPath();g.arc(X(o[0]),Y(o[1]),sc.R[k]*sc_,0,7);g.fill();g.strokeStyle='#bc4235';g.setLineDash([6,4]);g.lineWidth=1.5;g.beginPath();g.arc(X(o[0]),Y(o[1]),sc.R[k]*sc_,0,7);g.stroke();g.setLineDash([]);g.fillStyle='#c44336';g.beginPath();g.arc(X(o[0]),Y(o[1]),o[2]*sc_,0,7);g.fill();});
 if(mode!=='appr'&&mode!=='cmp'&&$('showref')&&$('showref').checked){const r=D[mode].ref;poly(r.x.map((x,i)=>[x,r.y[i]]),'#d9a21b',2.5,[8,4]);}
 const k=+$('tm').value;
 if(S.multi){S.multi.forEach((m,i)=>{const kk=Math.min(k,m.tr.length-1);poly(m.tr.slice(0,kk+1).map(p=>[p.x,p.y]),COL[i],i===S.best?4:2.5);const p=m.tr[kk];if(p){g.save();g.translate(X(p.x),Y(p.y));g.rotate(-p.th);g.fillStyle=COL[i];g.fillRect(-.15*sc_,-.1*sc_,.3*sc_,.2*sc_);g.restore();g.fillStyle=COL[i];g.beginPath();g.arc(X(p.x+m.ell*Math.cos(p.th)),Y(p.y+m.ell*Math.sin(p.th)),4,0,7);g.fill();}});g.fillStyle='#23313b';g.font='14px system-ui';g.fillText('Each colour is one lookahead value (see table)',8,18);return;}
 const tr=S.tr;poly(tr.slice(0,k+1).map(p=>[p.x,p.y]),'#0e8c80',3);
 const p=tr[Math.min(k,tr.length-1)];if(p){g.save();g.translate(X(p.x),Y(p.y));g.rotate(-p.th);const L=(mode==='appr'?0.3:0.5)*sc_,Wd=(mode==='appr'?0.2:0.3)*sc_;g.fillStyle='#0b2029';g.fillRect(-L/2,-Wd/2,L,Wd);g.restore();
  g.strokeStyle='#0e8c80';g.lineWidth=2;g.beginPath();g.moveTo(X(p.x),Y(p.y));g.lineTo(X(p.pl[0]||p.x+V.ell*Math.cos(p.th)),Y(p.pl[1]||p.y+V.ell*Math.sin(p.th)));g.stroke();
  g.fillStyle='#0e8c80';g.beginPath();g.arc(X(p.x+V.ell*Math.cos(p.th)),Y(p.y+V.ell*Math.sin(p.th)),5,0,7);g.fill();}
 g.fillStyle='#23313b';g.font='14px system-ui';g.fillText('ℓ = '+V.ell.toFixed(2)+' m',8,18);
}
function drawControls(){
 if(mode!=='appr')return;const[g,W,H]=setup($('ct'),.72);const k=Math.min(+$('tm').value,S.tr.length-1),p=S.tr[k],sc=S.sc;
 const r=step(sc,{x:p.x,y:p.y,th:p.th},nearest(sc,p.x,p.y,0,sc.px.length)[0]);
 const A=v=>44+v/1.5*(W-60),B=w=>H-34-(w+2)/4*(H-56);g.clearRect(0,0,W,H);g.font='12px system-ui';g.fillStyle='#64747c';
 for(let v=0;v<=1.5;v+=.3){g.strokeStyle='#e2e9e9';g.beginPath();g.moveTo(A(v),12);g.lineTo(A(v),H-34);g.stroke();g.fillText(v.toFixed(1),A(v)-8,H-18);}
 for(let w=-2;w<=2;w++){g.strokeStyle='#e2e9e9';g.beginPath();g.moveTo(44,B(w));g.lineTo(W-16,B(w));g.stroke();g.fillText(w,24,B(w)+4);}
 let pg=[[0,-2],[1.5,-2],[1.5,2],[0,2]];for(const q of r.rows)pg=clip(pg,...q);
 if(pg.length){g.beginPath();pg.forEach(([v,w],i)=>i?g.lineTo(A(v),B(w)):g.moveTo(A(v),B(w)));g.closePath();g.fillStyle='#a4d7d0';g.fill();g.strokeStyle='#0e8c80';g.lineWidth=1.5;g.stroke();}
 g.strokeStyle='#b64335';g.lineWidth=2.5;for(const[a,b,c]of r.rowO){if(Math.abs(b)>1e-10){g.beginPath();g.moveTo(A(0),B(c/b));g.lineTo(A(1.5),B((c-a*1.5)/b));g.stroke();}else if(Math.abs(a)>1e-10){g.beginPath();g.moveTo(A(c/a),B(-2));g.lineTo(A(c/a),B(2));g.stroke();}}
 g.fillStyle='#182b33';g.beginPath();g.arc(A(r.vn),B(r.wn),5,0,7);g.fill();if(r.u){g.fillStyle='#0e8c80';g.beginPath();g.arc(A(r.u[0]),B(r.u[1]),7,0,7);g.fill();}
 g.fillStyle='#23313b';g.font='13px system-ui';g.fillText('v (m/s)',W/2-20,H-3);g.fillText('ω (rad/s)',46,12);}
// ---------- UI ----------
function build(){const sp=SPEC[mode];$('ttl').textContent=sp.ttl;V={};$('par').innerHTML=sp.p.map(([k,l,mn,mx,st,df])=>{V[k]=df;return`<label>${l} <output id="o_${k}"></output><input type="range" id="i_${k}" min="${mn}" max="${mx}" step="${st}" value="${df}"></label>`}).join('')+(mode!=='appr'&&mode!=='cmp'?'<label style="font-size:14px"><input type="checkbox" id="showref" checked> Show Python reference run (gold)</label>':'');
 sp.p.forEach(([k,l,mn,mx,st])=>{$('i_'+k).addEventListener('input',e=>{V[k]=+e.target.value;run();});});
 if($('showref'))$('showref').addEventListener('change',draw);
 V.ell=V.ell||0;$('ctlWrap').style.display=mode==='appr'?'block':'none';
 $('leg').innerHTML=mode==='cmp'?'Four robots start together at the left and follow the dashed line. Coloured paths: one per lookahead ℓ. Red disc: obstacle with its inflated radius. Thick line: the best value by the rule below the table.':mode==='appr'?'<span class="sw" style="background:#0e8c80"></span>driven path · dashed grey: reference line · solid red: obstacle · dashed red: inflated radius Rs · robot axle p and lookahead point pℓ':'<span class="sw" style="background:#0e8c80"></span>this page\'s run · <span class="sw" style="background:#d9a21b"></span>your Python run (ℓ=0.1, margin 0.05, α=6, CLF + track barriers) · grey: track limits';
 run();}
function labels(){for(const[k]of SPEC[mode].p){const e=$('o_'+k);if(e)e.value=(+V[k]).toFixed(k==='delta'?0:2);}}
function simAll(){const runs=['l1','l2','l3','l4'].map(k=>{V.ell=V[k];const r=simulate();return{ell:V[k],tr:r.tr,info:r.info,sc:r.sc};});let best=-1,bv=-1;runs.forEach((m,i)=>{if(m.info.outcome==='passed'&&!m.info.collide&&m.info.vminAfter>bv){bv=m.info.vminAfter;best=i;}});const L=Math.max(...runs.map(m=>m.tr.length));return{sc:runs[0].sc,tr:runs.reduce((a,m)=>m.tr.length>a.length?m.tr:a,runs[0].tr),info:runs[0].info,multi:runs,best};}
function run(){labels();S=mode==='cmp'?simAll():simulate();const m=S.tr.length;$('tm').max=m-1;$('tm').value=m-1;stats();draw();}
function draw(){drawScene();drawControls();if(S&&S.multi)cmpTable();}
function cmpTable(){$('vals').style.display='block';const k=+$('tm').value;let h='<table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left;color:#566b74"><th>ℓ</th><th>v</th><th>ω</th><th>result</th></tr>';S.multi.forEach((m,i)=>{const p=m.tr[Math.min(k,m.tr.length-1)],inf=m.info,ok=inf.outcome==='passed';h+=`<tr style="border-top:1px solid #d1dfdf"><td><span class="sw" style="background:${COL[i]}"></span>${m.ell.toFixed(2)}${i===S.best?' ★':''}</td><td>${p.v.toFixed(2)}</td><td>${p.w.toFixed(2)}</td><td class="${ok&&!inf.collide?'good':'warn'}">${ok?'passes':'stalls'}</td></tr><tr style="color:#566b74;font-size:13px"><td colspan="4">${ok?`time ${inf.lap.toFixed(1)} s · min speed ${inf.vminAfter.toFixed(2)} m/s · closest to obstacle ${inf.minClr.toFixed(2)} m`:`stopped ${inf.minClr.toFixed(2)} m from the obstacle`}</td></tr>`;});h+='</table>';$('vals').innerHTML=h+'<p class="lg">v (m/s) and ω (rad/s) are the QP output at the selected time. ★ = best by this rule: among values that pass, the highest minimum speed. Another rule, for example more clearance, can pick another value.</p>';}
function stats(){$('vals').style.display='';if(S.multi){$('st').innerHTML='';cmpTable();return;}const i=S.info,a=mode==='appr',ok=i.outcome==='lap'||i.outcome==='passed';
 let msg=a?(i.outcome==='passed'?'Passed the obstacle':i.outcome==='stalled'?'Stalled in front of the obstacle':'Not finished in 15 s'):(i.outcome==='lap'?'Lap completed':i.outcome==='stalled'?'Stalled (no progress)':'Not finished in 50 s');
 const cls=ok&&!i.collide?'good':'warn';$('st').innerHTML=`<span class="${cls}">${msg}${i.collide?' · axle inside obstacle':''}</span>`;
 const f=(x,d=2)=>isFinite(x)&&Math.abs(x)<1e8?x.toFixed(d):'—';
 const rows=[[a?'Time to pass (s)':'Lap time (s)',i.lap?f(i.lap,1):'—'],['Min axle-to-obstacle-surface (m)',f(i.minClr)],['Min barrier value h (m²)',f(i.hmin,3)],['Min speed after 2 s (m/s)',f(i.vminAfter)],['QP infeasible steps',i.inf]];

$('foot').innerHTML='<b>What this page is.</b> A browser re-implementation for exploration: unicycle at the axle p, lookahead point pℓ = p + ℓ(cos θ, sin θ), barrier h = ‖pℓ − o‖² − Rs², constraint 2dᵀt̂ v + 2ℓ dᵀn̂ ω ≥ −αh, and a two-variable QP that stays closest to a path-tracking command at pℓ. <b>It is not your Python/ROS controller.</b> It has no CLF slack, no track-limit barriers, no vision delay and no body ellipse (the robot is a point at the axle), so lap times and clearances differ from the reported results. The gold curve is the Python run for comparison. At ℓ = 0 the obstacle barrier has no ω term, so the robot cannot steer around an obstacle ahead. Everything runs locally; no data leave this page.<br><a href="play_videos.html">Animation clips</a> · <a href="media/LACART_Lookahead_Explorer.html">Original one-step explorer</a>';
